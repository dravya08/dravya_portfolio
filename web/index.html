<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Dravya Gohil — Flutter Developer Portfolio">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta property="og:title" content="Dravya Gohil — Flutter Developer">
  <meta property="og:description" content="4+ years building scalable mobile and web applications with Flutter.">
  <title>Dravya Gohil — Flutter Developer</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      background-color: #0a0a0f;
      margin: 0;
      padding: 0;
    }
    #loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #0a0a0f;
    }
    .loader-dot {
      width: 8px; height: 8px;
      background: #7b6ef6;
      border-radius: 50%;
      display: inline-block;
      margin: 0 4px;
      animation: bounce 1.2s infinite ease-in-out both;
    }
    .loader-dot:nth-child(2) { animation-delay: 0.16s; }
    .loader-dot:nth-child(3) { animation-delay: 0.32s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="loader-dot"></div>
    <div class="loader-dot"></div>
    <div class="loader-dot"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function() {
      const loader = document.getElementById('loading');
      if (loader) loader.style.display = 'none';
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
